databaseChangeLog:
  - changeSet:
      id: create-chats-table
      author: system
      changes:
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: user_message
                  type: TEXT
              - column:
                  name: keywords
                  type: TEXT
              - column:
                  name: summary
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_update
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-pubmed-queries-table
      author: system
      changes:
        - createTable:
            tableName: pubmed_queries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: query
                  type: TEXT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: pubmed_queries
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_pubmed_queries_chat
            onDelete: CASCADE

  - changeSet:
      id: create-chat-interactions-table
      author: system
      changes:
        - createTable:
            tableName: chat_interactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: interaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: chat_interactions
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_chat_interactions_chat
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: chat_interactions
            baseColumnNames: interaction_id
            referencedTableName: interactions
            referencedColumnNames: id
            constraintName: fk_chat_interactions_interaction
            onDelete: CASCADE
        - createIndex:
            indexName: idx_chat_interactions_chat_id
            tableName: chat_interactions
            columns:
              - column:
                  name: chat_id
        - createIndex:
            indexName: idx_chat_interactions_interaction_id
            tableName: chat_interactions
            columns:
              - column:
                  name: interaction_id

