spring:
  application:
    name: diplom

  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password: password
    url: jdbc:h2:file:./data/diplomdb;AUTO_SERVER=TRUE
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    open-in-view: false

server:
  error:
    include-message: always

llm:
  model: openai
  openai:
    base-url: https://api.artemox.com/v1
    api-key: ${OPENAI_API_KEY}

logging:
  level:
    root: INFO
    io.github.nogll.diplom: DEBUG